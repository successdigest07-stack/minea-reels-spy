<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meta Ad Spy Tool</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        html, body { height: 100%; width: 100%; overflow: hidden; background-color: #0d0e12; color: #fff; display: flex; flex-direction: column; align-items: center; }
        
        header { width: 100%; max-width: 480px; background: #181920; padding: 10px; border-bottom: 1px solid #2a2b36; z-index: 100; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
        .search-box { display: flex; gap: 6px; }
        .search-box input { flex: 1; padding: 8px 10px; border-radius: 6px; border: 1px solid #333; background: #0d0e12; color: #fff; font-size: 0.85rem; outline: none; }
        .search-box button { padding: 8px 14px; background: #0084ff; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
        
        .filters-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
        select { background: #222430; color: #ccc; border: 1px solid #333; padding: 6px; border-radius: 4px; font-size: 0.75rem; outline: none; width: 100%; }

        .reels-container { width: 100%; max-width: 480px; flex: 1; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; position: relative; }
        .reels-container::-webkit-scrollbar { display: none; }
        .reel { position: relative; width: 100%; height: 100%; scroll-snap-align: start; background: #111; display: flex; justify-content: center; align-items: center; }
        .reel video, .reel img.media-content { width: 100%; height: 100%; object-fit: cover; }
        .overlay-gradient { position: absolute; bottom: 0; left: 0; right: 0; height: 65%; background: linear-gradient(to top, rgba(0,0,0,0.95) 20%, transparent); pointer-events: none; }

        .top-meta { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .profile-chip { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.65); padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(8px); }
        .profile-dp { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
        .brand-name { font-size: 0.8rem; font-weight: bold; color: #fff; }
        .status-badge { font-size: 0.65rem; padding: 3px 8px; border-radius: 12px; font-weight: bold; }
        .status-active { background: rgba(0, 230, 118, 0.2); color: #00e676; border: 1px solid #00e676; }
        .status-inactive { background: rgba(255, 82, 82, 0.2); color: #ff5252; border: 1px solid #ff5252; }

        .bottom-details { position: absolute; bottom: 16px; left: 12px; right: 12px; z-index: 10; display: flex; flex-direction: column; gap: 8px; }
        .ad-copy { font-size: 0.8rem; line-height: 1.3; color: #ddd; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

        .tags-row { display: flex; gap: 6px; flex-wrap: wrap; }
        .tag { background: rgba(255,255,255,0.15); font-size: 0.65rem; padding: 3px 6px; border-radius: 4px; backdrop-filter: blur(4px); }
        .tag-highlight { background: rgba(0,198,255,0.25); border: 1px solid rgba(0,198,255,0.5); color: #00e5ff; font-weight: bold; }

        .cta-row { display: flex; gap: 8px; margin-top: 4px; }
        .cta-btn-store { flex: 1; padding: 10px; background: linear-gradient(135deg, #00c6ff, #0072ff); color: white; text-align: center; text-decoration: none; font-weight: bold; border-radius: 8px; font-size: 0.8rem; box-shadow: 0 4px 12px rgba(0,114,255,0.3); }
        .cta-btn-library { flex: 1; padding: 10px; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: white; text-align: center; text-decoration: none; font-weight: bold; border-radius: 8px; font-size: 0.8rem; backdrop-filter: blur(6px); }
    </style>
</head>
<body>

    <header>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search product ads e.g., brush, shoes..." value="silicone brush">
            <button onclick="applyFilters()">Search Ads</button>
        </div>
        <div class="filters-grid">
            <select id="countryFilter" onchange="applyFilters()">
                <option value="IN">Country: India 🇮🇳</option>
                <option value="US">Country: USA 🇺🇸</option>
                <option value="GB">Country: UK 🇬🇧</option>
                <option value="CA">Country: Canada 🇨🇦</option>
                <option value="ALL">Country: All</option>
            </select>
            <select id="statusFilter" onchange="applyFilters()">
                <option value="ALL">Status: All</option>
                <option value="ACTIVE">Status: Active Only</option>
                <option value="INACTIVE">Status: Inactive</option>
            </select>
        </div>
    </header>

    <div class="reels-container" id="reelsFeed"></div>

    <script>
        const brandNames = ["Uniqly.IN", "Aura Care", "Urban Style", "FitFlex Pro", "PureBlend", "Nordic Gear", "ChefPro Kitchen", "NovaSound Audio"];
        const categories = ["Beauty & Skincare", "E-Commerce Brand", "Fashion & Apparel", "Health & Fitness", "Consumer Electronics", "Home & Kitchen"];

        const videoSources = [
            "https://www.w3schools.com/html/mov_bbb.mp4",
            "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
            "https://www.w3schools.com/html/movie.mp4"
        ];

        let adCounter = Math.floor(Math.random() * 1000) + 100;

        function createAdCard(id, query, countryFilter, statusFilter) {
            const isVideo = (id % 2 === 0);
            const brand = brandNames[id % brandNames.length];
            const category = categories[id % categories.length];
            const searchKeyword = query || "silicone brush";
            const adCopy = `Special deal on ${searchKeyword}! High performance, premium quality. Order today with free shipping!`;

            const country = (countryFilter !== 'ALL') ? countryFilter : "IN";
            const status = (statusFilter !== 'ALL') ? statusFilter : ((id % 2 === 0) ? "ACTIVE" : "INACTIVE");

            const videoUrl = `${videoSources[id % videoSources.length]}?v=${id}`;
            const imageUrl = `https://picsum.photos/seed/ad_${id}/600/1000`;
            const dpUrl = `https://picsum.photos/seed/dp_${id}/150/150`;

            // CTA links directly to Meta's public Ad Library search feed for that exact query & country
            const liveStoreUrl = `https://www.facebook.com/ads/library/?active_status=${status.toLowerCase()}&ad_type=all&country=${country}&q=${encodeURIComponent(searchKeyword + ' ' + brand)}`;
            const adLibraryUrl = `https://www.facebook.com/ads/library/?active_status=all&ad_type=all&country=${country}&q=${encodeURIComponent(searchKeyword)}`;

            return {
                id: `ad_${id}`,
                isVideo: isVideo,
                brandName: brand,
                category: category,
                dp: dpUrl,
                mediaUrl: isVideo ? videoUrl : imageUrl,
                poster: imageUrl,
                status: status,
                country: country,
                adCopy: adCopy,
                storeUrl: liveStoreUrl,
                adLibraryUrl: adLibraryUrl,
                daysRunning: (id % 15) + 1
            };
        }

        function renderCards() {
            const feedContainer = document.getElementById('reelsFeed');
            const query = document.getElementById('searchInput').value.trim();
            const country = document.getElementById('countryFilter').value;
            const status = document.getElementById('statusFilter').value;

            let html = '';
            for (let i = 1; i <= 10; i++) {
                const ad = createAdCard(adCounter + i, query, country, status);

                const mediaElement = ad.isVideo 
                    ? `<video src="${ad.mediaUrl}" poster="${ad.poster}" autoplay loop muted playsinline class="media-content"></video>`
                    : `<img src="${ad.mediaUrl}" alt="Ad Creative" class="media-content">`;

                html += `
                <div class="reel" data-id="${ad.id}">
                    ${mediaElement}
                    <div class="overlay-gradient"></div>
                    
                    <div class="top-meta">
                        <div class="profile-chip">
                            <img class="profile-dp" src="${ad.dp}" alt="DP">
                            <div>
                                <div class="brand-name">${ad.brandName} <span style="color:#0084ff;">☑️</span></div>
                            </div>
                        </div>
                        <span class="status-badge ${ad.status === 'ACTIVE' ? 'status-active' : 'status-inactive'}">${ad.status}</span>
                    </div>

                    <div class="bottom-details">
                        <div class="tags-row">
                            <span class="tag tag-highlight">🔥 ${ad.category}</span>
                            <span class="tag">🌐 ${ad.country}</span>
                            <span class="tag">📅 Running: ${ad.daysRunning} Days</span>
                        </div>

                        <p class="ad-copy">${ad.adCopy}</p>

                        <div class="cta-row">
                            <a href="${ad.storeUrl}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation();" class="cta-btn-store">
                                Visit Live Ad / Store 🛍️ ↗
                            </a>
                            <a href="${ad.adLibraryUrl}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation();" class="cta-btn-library">
                                Meta Library ➔
                            </a>
                        </div>
                    </div>
                </div>
                `;
            }
            feedContainer.innerHTML = html;
        }

        function applyFilters() {
            adCounter += 10;
            renderCards();
        }

        window.onload = () => {
            renderCards();
        };
    </script>
</body>
</html>
