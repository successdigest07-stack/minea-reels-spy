<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Ad Spy - Reels Format</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d0e12;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        header {
            width: 100%;
            max-width: 480px;
            background: #181920;
            padding: 10px 12px;
            border-bottom: 1px solid #2a2b36;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .search-box {
            display: flex;
            gap: 8px;
        }

        .search-box input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #0d0e12;
            color: #fff;
            outline: none;
            font-size: 0.85rem;
        }

        .search-box button {
            padding: 8px 14px;
            background: #0084ff;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .filters-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        select, input[type="date"] {
            background: #222430;
            color: #ccc;
            border: 1px solid #333;
            padding: 5px;
            border-radius: 4px;
            font-size: 0.7rem;
            outline: none;
            width: 100%;
        }

        .reels-container {
            width: 100%;
            max-width: 480px;
            height: calc(100vh - 105px);
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
        }

        .reels-container::-webkit-scrollbar {
            display: none;
        }

        .reel {
            position: relative;
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .reel video, .reel img.media-content {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .overlay-gradient {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60%;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 20%, transparent);
            pointer-events: none;
        }

        .top-meta {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .brand-badge {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-active { background: #00e676; color: #000; }
        .status-inactive { background: #ff5252; color: #fff; }

        .side-actions {
            position: absolute;
            right: 12px;
            bottom: 110px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 20;
        }

        .action-btn {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.85rem;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }

        .bottom-details {
            position: absolute;
            bottom: 15px;
            left: 15px;
            right: 65px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .ad-copy {
            font-size: 0.85rem;
            line-height: 1.3;
            color: #ddd;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .tags-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .tag {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            font-size: 0.65rem;
            padding: 3px 6px;
            border-radius: 4px;
        }

        .insights-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
        }

        .metric-box {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            padding: 6px 8px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .metric-box .label {
            font-size: 0.6rem;
            color: #aaa;
            text-transform: uppercase;
        }

        .metric-box .val {
            font-size: 0.75rem;
            font-weight: bold;
            color: #00c6ff;
            margin-top: 1px;
        }

        .cta-btn {
            display: block;
            width: 100%;
            padding: 10px;
            background: #0084ff;
            color: white;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
            font-size: 0.8rem;
            box-shadow: 0 4px 12px rgba(0, 132, 255, 0.3);
        }
    </style>
</head>
<body>

    <header>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search keywords..." oninput="applyFilters()">
            <button onclick="applyFilters()">Search</button>
        </div>
        
        <div class="filters-grid">
            <select id="countryFilter" onchange="applyFilters()">
                <option value="ALL">All Countries</option>
                <option value="IN">India 🇮🇳</option>
                <option value="US">United States 🇺🇸</option>
                <option value="GB">United Kingdom 🇬🇧</option>
                <option value="CA">Canada 🇨🇦</option>
                <option value="AU">Australia 🇦🇺</option>
                <option value="DE">Germany 🇩🇪</option>
                <option value="AE">UAE 🇦🇪</option>
                <option value="SG">Singapore 🇸🇬</option>
            </select>

            <select id="statusFilter" onchange="applyFilters()">
                <option value="ALL">All Status</option>
                <option value="ACTIVE">Active</option>
                <option value="INACTIVE">Inactive</option>
            </select>

            <select id="languageFilter" onchange="applyFilters()">
                <option value="ALL">All Languages</option>
                <option value="en">English</option>
                <option value="hi">Hindi</option>
                <option value="de">German</option>
            </select>

            <select id="platformFilter" onchange="applyFilters()">
                <option value="ALL">All Platforms</option>
                <option value="Instagram">Instagram</option>
                <option value="Facebook">Facebook</option>
                <option value="Audience Network">Audience Network</option>
            </select>

            <input type="date" id="startDate" onchange="applyFilters()" title="Start Date">
            <input type="date" id="endDate" onchange="applyFilters()" title="End Date">
        </div>
    </header>

    <div class="reels-container" id="reelsFeed" onscroll="checkInfiniteScroll()"></div>

    <script>
        const brandPrefixes = ["Aura", "Urban", "Kesh", "Fit", "Pure", "Nordic", "Velvet", "Glow", "Chef", "Nova", "Zen", "Hydro", "Eco"];
        const brandSuffixes = ["Pro", "Lab", "Care", "Flex", "Blend", "Grinder", "Skin", "Up", "Kitchen", "Audio", "Chair", "Gear"];
        
        const copyTemplates = [
            "Smart automatic kitchen tool. Save 50% time cooking daily!",
            "Waterproof anti-theft bag with fast charging port.",
            "Organic nourishing formula for fast shine & strength.",
            "Track fitness metrics with AMOLED HD display smartwatch.",
            "Transform your room ambiance with custom LED lighting.",
            "Non-slip eco-friendly mat designed for daily stability.",
            "Blend fresh smoothies on the go with portable 6-blade blender."
        ];

        const reliableVideos = [
            "https://www.w3schools.com/html/mov_bbb.mp4",
            "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
            "https://www.w3schools.com/html/movie.mp4"
        ];

        const countries = ["IN", "US", "GB", "CA", "AU", "DE", "AE", "SG"];
        const languages = ["en", "hi", "de"];
        const platformsList = [["Facebook", "Instagram"], ["Instagram"], ["Facebook"], ["Audience Network", "Instagram"]];

        let autoId = 1000;
        let isFetching = false;

        function getActiveFilters() {
            return {
                query: document.getElementById('searchInput').value.toLowerCase().trim(),
                country: document.getElementById('countryFilter').value,
                status: document.getElementById('statusFilter').value,
                language: document.getElementById('languageFilter').value,
                platform: document.getElementById('platformFilter').value,
                startDate: document.getElementById('startDate').value,
                endDate: document.getElementById('endDate').value
            };
        }

        function createUniqueAd(filters) {
            autoId++;
            const isVideo = (autoId % 3 !== 0); // 66% Videos, 33% Images
            
            const brand = `${brandPrefixes[autoId % brandPrefixes.length]} ${brandSuffixes[(autoId + 3) % brandSuffixes.length]}`;
            const adCopy = `${copyTemplates[autoId % copyTemplates.length]} (#${autoId})`;
            
            const country = (filters.country !== 'ALL') ? filters.country : countries[autoId % countries.length];
            const status = (filters.status !== 'ALL') ? filters.status : ((autoId % 2 === 0) ? "ACTIVE" : "INACTIVE");
            const lang = (filters.language !== 'ALL') ? filters.language : languages[autoId % languages.length];
            const platforms = (filters.platform !== 'ALL') ? [filters.platform] : platformsList[autoId % platformsList.length];

            const imageSrc = `https://picsum.photos/seed/${autoId}/600/1000`;
            const videoSrc = reliableVideos[autoId % reliableVideos.length];

            const startDay = (autoId % 20) + 1;
            const startDate = `2026-0${(autoId % 2) + 1}-${startDay < 10 ? '0' + startDay : startDay}`;
            const endDate = status === "ACTIVE" ? "Running Now" : "2026-03-01";

            return {
                id: `ad_${autoId}`,
                type: isVideo ? "video" : "image",
                brandName: brand,
                poster: imageSrc,
                mediaUrl: isVideo ? videoSrc : imageSrc,
                startDate: startDate,
                endDate: endDate,
                status: status,
                country: country,
                language: lang,
                platforms: platforms,
                adCopy: adCopy,
                landingPage: "https://facebook.com/ads/library"
            };
        }

        const feedContainer = document.getElementById('reelsFeed');

        function renderAdCards(adsArray, append = false) {
            if (!append && adsArray.length === 0) {
                feedContainer.innerHTML = '<div style="text-align:center; padding-top:40%; color:#888;">No ads match your filters.</div>';
                return;
            }

            const html = adsArray.map((ad) => {
                const mediaHTML = ad.type === 'video' 
                    ? `<video loop playsinline muted autoplay webkit-playsinline src="${ad.mediaUrl}"></video>`
                    : `<img class="media-content" src="${ad.mediaUrl}" alt="${ad.brandName}">`;

                return `
                <div class="reel" data-id="${ad.id}" onclick="togglePlay(this)">
                    ${mediaHTML}
                    <div class="overlay-gradient"></div>
                    
                    <div class="top-meta">
                        <span class="brand-badge">${ad.brandName}</span>
                        <span class="status-badge ${ad.status === 'ACTIVE' ? 'status-active' : 'status-inactive'}">
                            ${ad.status}
                        </span>
                    </div>

                    <div class="side-actions">
                        <div class="action-btn" onclick="event.stopPropagation(); alert('Ad ID: ${ad.id}')">🆔</div>
                        <div class="action-btn" onclick="event.stopPropagation(); alert('Country: ${ad.country} | Lang: ${ad.language}')">🌐</div>
                        <div class="action-btn" onclick="event.stopPropagation(); navigator.clipboard.writeText('${ad.landingPage}'); alert('Link Copied!')">🔗</div>
                    </div>

                    <div class="bottom-details">
                        <div class="tags-row">
                            <span class="tag">${ad.type === 'video' ? '🎥 Video' : '🖼️ Image'}</span>
                            <span class="tag">🌐 ${ad.country}</span>
                            <span class="tag">🗣️ ${ad.language.toUpperCase()}</span>
                            ${ad.platforms.map(p => `<span class="tag">${p}</span>`).join('')}
                        </div>

                        <p class="ad-copy">${ad.adCopy}</p>
                        
                        <div class="insights-grid">
                            <div class="metric-box">
                                <div class="label">Started Date</div>
                                <div class="val">${ad.startDate}</div>
                            </div>
                            <div class="metric-box">
                                <div class="label">End Date</div>
                                <div class="val">${ad.endDate}</div>
                            </div>
                        </div>

                        <a href="${ad.landingPage}" target="_blank" onclick="event.stopPropagation();" class="cta-btn">View in Ad Library ➔</a>
                    </div>
                </div>
                `;
            }).join('');

            if (append) {
                feedContainer.insertAdjacentHTML('beforeend', html);
            } else {
                feedContainer.innerHTML = html;
                feedContainer.scrollTop = 0;
            }

            setupAutoplayObserver();
        }

        function appendBatch(count = 5) {
            const filters = getActiveFilters();
            const batch = [];
            for (let i = 0; i < count; i++) {
                batch.push(createUniqueAd(filters));
            }
            renderAdCards(batch, true);
        }

        function applyFilters() {
            feedContainer.innerHTML = '';
            const filters = getActiveFilters();
            const initialBatch = [];
            for (let i = 0; i < 6; i++) {
                initialBatch.push(createUniqueAd(filters));
            }
            renderAdCards(initialBatch, false);
        }

        function checkInfiniteScroll() {
            if (isFetching) return;

            if (feedContainer.scrollTop + feedContainer.clientHeight >= feedContainer.scrollHeight - 600) {
                isFetching = true;
                appendBatch(4);
                setTimeout(() => { isFetching = false; }, 200);
            }
        }

        function togglePlay(reelElem) {
            const video = reelElem.querySelector('video');
            if (video) {
                if (video.paused) {
                    video.play().catch(() => {});
                } else {
                    video.pause();
                }
            }
        }

        function setupAutoplayObserver() {
            const reels = document.querySelectorAll('.reel');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target.querySelector('video');
                    if (video) {
                        if (entry.isIntersecting) {
                            video.play().catch(() => {});
                        } else {
                            video.pause();
                            video.currentTime = 0;
                        }
                    }
                });
            }, { threshold: 0.6 });

            reels.forEach(reel => observer.observe(reel));
        }

        // Initialize Feed
        applyFilters();
    </script>
</body>
</html>
