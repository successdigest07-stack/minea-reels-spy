<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meta Ad Spy - Reels Format</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #0d0e12;
            color: #fff;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 480px;
            background: #181920;
            padding: 8px 10px;
            border-bottom: 1px solid #2a2b36;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;
        }

        .search-box {
            display: flex;
            gap: 6px;
        }

        .search-box input {
            flex: 1;
            padding: 7px 10px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #0d0e12;
            color: #fff;
            outline: none;
            font-size: 0.8rem;
        }

        .search-box button {
            padding: 7px 12px;
            background: #0084ff;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .filters-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        select, input[type="date"] {
            background: #222430;
            color: #ccc;
            border: 1px solid #333;
            padding: 4px 6px;
            border-radius: 4px;
            font-size: 0.68rem;
            outline: none;
            width: 100%;
            height: 28px;
        }

        .reels-container {
            width: 100%;
            max-width: 480px;
            height: calc(100vh - 110px);
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
            position: relative;
        }

        .reels-container::-webkit-scrollbar {
            display: none;
        }

        .reel {
            position: relative;
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .reel video, .reel img.media-content {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        .overlay-gradient {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65%;
            background: linear-gradient(to top, rgba(0,0,0,0.98) 25%, transparent);
            pointer-events: none;
            z-index: 1;
        }

        .top-meta {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .profile-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(10px);
            padding: 4px 10px 4px 4px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
        }

        .profile-dp {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #0084ff;
        }

        .profile-info {
            display: flex;
            flex-direction: column;
        }

        .brand-name {
            font-size: 0.78rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .page-category {
            font-size: 0.58rem;
            color: #aaa;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.65rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-active { background: #00e676; color: #000; }
        .status-inactive { background: #ff5252; color: #fff; }

        .side-actions {
            position: absolute;
            right: 10px;
            bottom: 80px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 20;
        }

        .action-btn {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.85rem;
            cursor: pointer;
            backdrop-filter: blur(5px);
            text-decoration: none;
        }

        .bottom-details {
            position: absolute;
            bottom: 12px;
            left: 12px;
            right: 58px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .ad-copy {
            font-size: 0.78rem;
            line-height: 1.25;
            color: #ddd;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .tags-row {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .tag {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            font-size: 0.62rem;
            padding: 3px 6px;
            border-radius: 4px;
        }

        .tag-highlight {
            background: rgba(0, 198, 255, 0.25);
            border: 1px solid rgba(0, 198, 255, 0.5);
            color: #00e5ff;
            font-weight: bold;
        }

        .insights-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 5px;
        }

        .metric-box {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            padding: 4px 6px;
            border-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .metric-box .label {
            font-size: 0.55rem;
            color: #aaa;
            text-transform: uppercase;
        }

        .metric-box .val {
            font-size: 0.7rem;
            font-weight: bold;
            color: #00c6ff;
            margin-top: 1px;
        }

        .cta-row {
            display: flex;
            gap: 6px;
            margin-top: 2px;
        }

        .cta-btn-store {
            flex: 1;
            padding: 8px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
            font-size: 0.75rem;
            box-shadow: 0 4px 12px rgba(0, 114, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
        }

        .cta-btn-library {
            flex: 1;
            padding: 8px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
            font-size: 0.75rem;
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: flex-end;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-drawer {
            width: 100%;
            max-width: 480px;
            background: #181920;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            padding: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            animation: slideUp 0.25s ease-out forwards;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 14px;
            border-bottom: 1px solid #2a2b36;
            margin-bottom: 14px;
        }

        .modal-dp {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #0084ff;
        }

        .modal-title-box h3 {
            font-size: 1.05rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .modal-title-box p {
            font-size: 0.75rem;
            color: #aaa;
        }

        .info-stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .info-stat-card {
            background: #222430;
            padding: 8px 10px;
            border-radius: 8px;
            text-align: center;
        }

        .info-stat-card .num {
            font-size: 0.85rem;
            font-weight: bold;
            color: #00c6ff;
        }

        .info-stat-card .lbl {
            font-size: 0.6rem;
            color: #888;
            margin-top: 2px;
            text-transform: uppercase;
        }

        .page-meta-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 0.78rem;
            color: #ccc;
            margin-bottom: 18px;
        }

        .page-meta-item {
            display: flex;
            justify-content: space-between;
            background: #111218;
            padding: 8px 10px;
            border-radius: 6px;
            align-items: center;
        }

        .visit-store-btn {
            display: block;
            width: 100%;
            padding: 10px;
            background: #0084ff;
            color: #fff;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        .close-modal-btn {
            width: 100%;
            padding: 10px;
            background: #2a2b36;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search keywords...">
            <button id="searchBtn">Search</button>
        </div>
        
        <div class="filters-grid">
            <div class="filter-group">
                <select id="countryFilter">
                    <option value="ALL">All Countries</option>
                    <option value="IN">India 🇮🇳</option>
                    <option value="US">United States 🇺🇸</option>
                    <option value="GB">United Kingdom 🇬🇧</option>
                    <option value="CA">Canada 🇨🇦</option>
                    <option value="AU">Australia 🇦🇺</option>
                </select>
            </div>

            <div class="filter-group">
                <select id="statusFilter">
                    <option value="ALL">All Status</option>
                    <option value="ACTIVE">Active</option>
                    <option value="INACTIVE">Inactive</option>
                </select>
            </div>

            <div class="filter-group">
                <select id="languageFilter">
                    <option value="ALL">All Languages</option>
                    <option value="en">English</option>
                    <option value="hi">Hindi</option>
                </select>
            </div>

            <div class="filter-group">
                <select id="platformFilter">
                    <option value="ALL">All Platforms</option>
                    <option value="Instagram">Instagram</option>
                    <option value="Facebook">Facebook</option>
                </select>
            </div>

            <div class="filter-group">
                <input type="date" id="startDate" title="Start Date">
            </div>

            <div class="filter-group">
                <input type="date" id="endDate" title="End Date">
            </div>
        </div>
    </header>

    <div class="reels-container" id="reelsFeed"></div>

    <div class="modal-overlay" id="pageInfoModal">
        <div class="modal-drawer" onclick="event.stopPropagation()">
            <div class="modal-header">
                <img id="mDp" class="modal-dp" src="" alt="DP">
                <div class="modal-title-box">
                    <h3 id="mTitle">Brand <span style="color:#0084ff;">☑️</span></h3>
                    <p id="mCategory">E-Commerce Page</p>
                </div>
            </div>

            <div class="info-stats-grid">
                <div class="info-stat-card">
                    <div class="num" id="mFollowers">0</div>
                    <div class="lbl">Followers</div>
                </div>
                <div class="info-stat-card">
                    <div class="num" id="mActiveAds">0</div>
                    <div class="lbl">Active Ads</div>
                </div>
                <div class="info-stat-card">
                    <div class="num" id="mPageAge">N/A</div>
                    <div class="lbl">Page Age</div>
                </div>
            </div>

            <div class="page-meta-list">
                <div class="page-meta-item">
                    <span>Store / Landing Page:</span>
                    <a id="mStoreLink" href="#" target="_blank" rel="noopener noreferrer" style="color:#00c6ff; text-decoration:underline; font-weight:bold; overflow:hidden; text-overflow:ellipsis; max-width:180px; white-space:nowrap;">-</a>
                </div>
                <div class="page-meta-item">
                    <span>Page Creation Date:</span>
                    <strong id="mCreatedDate" style="color:#fff;">-</strong>
                </div>
                <div class="page-meta-item">
                    <span>Instagram Handle:</span>
                    <strong id="mInstaHandle" style="color:#00c6ff;">-</strong>
                </div>
                <div class="page-meta-item">
                    <span>Facebook Page ID:</span>
                    <strong id="mPageId" style="color:#aaa;">-</strong>
                </div>
            </div>

            <a id="mDirectStoreBtn" href="#" target="_blank" rel="noopener noreferrer" class="visit-store-btn">Visit Official Store 🛍️ ↗</a>
            <button class="close-modal-btn" id="closeModalBtn">Close Info</button>
        </div>
    </div>

    <script>
        // API Proxy endpoint connection
        const API_CONFIG = {
            USE_LIVE_API: true,
            BACKEND_URL: 'https://minea-reels-spy.onrender.com/api/search-ads'
        };

        const brandNames = ["Uniqly.IN", "Aura Care", "Urban Style", "FitFlex Pro", "PureBlend", "Nordic Gear"];
        const categories = ["Beauty & Skincare", "E-Commerce Brand", "Fashion & Apparel", "Health & Fitness"];
        const videoSources = [
            "https://www.w3schools.com/html/mov_bbb.mp4",
            "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
            "https://www.w3schools.com/html/movie.mp4"
        ];
        const realTestStores = ["https://happyplaneta.com", "https://plans.happyplaneta.com", "https://www.amazon.in"];

        let adCounter = 100;
        let isFetching = false;
        let currentAdsStore = {};
        let observer = null;

        const feedContainer = document.getElementById('reelsFeed');

        function calculateDaysRunning(startStr) {
            const start = new Date(startStr);
            const today = new Date();
            const diffTime = Math.abs(today - start);
            return Math.ceil(diffTime / (1000 * 60 * 60 * 24)) || 1;
        }

        function getActiveFilters() {
            return {
                query: document.getElementById('searchInput').value.toLowerCase().trim(),
                country: document.getElementById('countryFilter').value,
                status: document.getElementById('statusFilter').value,
                language: document.getElementById('languageFilter').value,
                platform: document.getElementById('platformFilter').value,
                startDate: document.getElementById('startDate').value,
                endDate: document.getElementById('endDate').value
            };
        }

        async function fetchAdsFromSource(filters) {
            if (API_CONFIG.USE_LIVE_API) {
                try {
                    const queryParams = new URLSearchParams(filters);
                    const res = await fetch(`${API_CONFIG.BACKEND_URL}?${queryParams}`);
                    const data = await res.json();
                    return data.ads || [];
                } catch (err) {
                    console.error("Failed to fetch live API data:", err);
                    return [];
                }
            }

            // Fallback mock data generation loop
            const mockBatch = [];
            for (let i = 0; i < 4; i++) {
                adCounter++;
                const currentId = adCounter;
                const isVideo = (currentId % 2 === 0);
                const brand = brandNames[currentId % brandNames.length];
                const category = categories[currentId % categories.length];
                const status = (filters.status !== 'ALL') ? filters.status : (currentId % 2 === 0 ? "ACTIVE" : "INACTIVE");
                const country = (filters.country !== 'ALL') ? filters.country : "IN";
                const lang = (filters.language !== 'ALL') ? filters.language : "en";
                const platform = (filters.platform !== 'ALL') ? filters.platform : "Instagram";
                const storeUrl = realTestStores[currentId % realTestStores.length];

                mockBatch.push({
                    id: `ad_${currentId}`,
                    type: isVideo ? "video" : "image",
                    brandName: brand,
                    category: category,
                    dp: `https://picsum.photos/seed/dp_${currentId}/150/150`,
                    mediaUrl: isVideo ? videoSources[currentId % videoSources.length] : `https://picsum.photos/seed/ad_${currentId}/600/1000`,
                    startDate: "2026-09-01",
                    endDate: status === "ACTIVE" ? "Running Now" : "2026-09-20",
                    daysRunning: calculateDaysRunning("2026-09-01"),
                    status: status,
                    country: country,
                    language: lang,
                    platforms: [platform],
                    adCopy: `Discover best deals for ${filters.query || 'trending items'}! Fast delivery across India.`,
                    storeUrl: storeUrl,
                    adLibraryUrl: `https://www.facebook.com/ads/library/?id=${1000000000 + currentId}`,
                    followers: `${(currentId * 1.5).toFixed(1)}K`,
                    activeAds: (currentId % 15) + 1,
                    pageAge: `${(currentId % 4) + 1} Yrs`,
                    createdDate: `2022-04-12`,
                    instaHandle: `@${brand.toLowerCase().replace(/[^a-z0-9]/g, '')}_official`,
                    pageId: `10928374${currentId}`
                });
            }
            return mockBatch;
        }

        function createCardHTML(ad) {
            const mediaHTML = ad.type === 'video' 
                ? `<video loop playsinline muted webkit-playsinline src="${ad.mediaUrl}"></video>`
                : `<img class="media-content" src="${ad.mediaUrl}" alt="${ad.brandName}">`;

            return `
            <div class="reel" data-id="${ad.id}">
                ${mediaHTML}
                <div class="overlay-gradient"></div>
                
                <div class="top-meta">
                    <div class="profile-chip" data-action="info" data-id="${ad.id}">
                        <img class="profile-dp" src="${ad.dp}" alt="DP">
                        <div class="profile-info">
                            <span class="brand-name">${ad.brandName} <span style="color:#0084ff; font-size:0.7rem;">☑️</span></span>
                            <span class="page-category">${ad.category}</span>
                        </div>
                    </div>

                    <span class="status-badge ${ad.status === 'ACTIVE' ? 'status-active' : 'status-inactive'}">
                        ${ad.status}
                    </span>
                </div>

                <div class="side-actions">
                    <a href="${ad.storeUrl}" target="_blank" rel="noopener noreferrer" class="action-btn" title="Visit Store">🛍️</a>
                    <button class="action-btn" data-action="info" data-id="${ad.id}" title="Page Details">ℹ️</button>
                    <button class="action-btn" data-action="copy" data-url="${ad.storeUrl}" title="Copy Link">🔗</button>
                </div>

                <div class="bottom-details">
                    <div class="tags-row">
                        <span class="tag tag-highlight">⏱️ ${ad.daysRunning} Days</span>
                        <span class="tag">${ad.type === 'video' ? '🎥 Video' : '🖼️ Image'}</span>
                        <span class="tag">🌐 ${ad.country}</span>
                        <span class="tag">🗣️ ${ad.language.toUpperCase()}</span>
                    </div>

                    <p class="ad-copy">${ad.adCopy}</p>
                    
                    <div class="insights-grid">
                        <div class="metric-box">
                            <div class="label">Started Date</div>
                            <div class="val">${ad.startDate}</div>
                        </div>
                        <div class="metric-box">
                            <div class="label">End Date</div>
                            <div class="val">${ad.endDate}</div>
                        </div>
                    </div>

                    <div class="cta-row">
                        <a href="${ad.storeUrl}" target="_blank" rel="noopener noreferrer" class="cta-btn-store">Visit Store 🛍️ ↗</a>
                        <a href="${ad.adLibraryUrl}" target="_blank" rel="noopener noreferrer" class="cta-btn-library">Ad Library ➔</a>
                    </div>
                </div>
            </div>
            `;
        }

        async function renderFeed(append = false) {
            if (isFetching) return;
            isFetching = true;

            const filters = getActiveFilters();
            const ads = await fetchAdsFromSource(filters);

            if (!append) {
                feedContainer.innerHTML = '';
                currentAdsStore = {};
                feedContainer.scrollTop = 0;
            }

            if (ads.length === 0 && !append) {
                feedContainer.innerHTML = '<div style="text-align:center; padding-top:40%; color:#888;">No ads found matching filters.</div>';
                isFetching = false;
                return;
            }

            ads.forEach(ad => { currentAdsStore[ad.id] = ad; });

            const html = ads.map(ad => createCardHTML(ad)).join('');
            feedContainer.insertAdjacentHTML('beforeend', html);

            setupObserver();
            isFetching = false;
        }

        function setupObserver() {
            if (observer) observer.disconnect();

            observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target.querySelector('video');
                    if (video) {
                        if (entry.isIntersecting) {
                            video.play().catch(() => {});
                        } else {
                            video.pause();
                            video.currentTime = 0;
                        }
                    }
                });
            }, { root: feedContainer, threshold: 0.6 });

            document.querySelectorAll('.reel').forEach(reel => observer.observe(reel));
        }

        function handleFeedScroll() {
            if (isFetching) return;
            const scrollBottom = feedContainer.scrollTop + feedContainer.clientHeight;
            if (scrollBottom >= feedContainer.scrollHeight - 300) {
                renderFeed(true);
            }
        }

        function handleFeedClick(e) {
            const target = e.target.closest('[data-action]');
            if (!target) return;

            const action = target.getAttribute('data-action');
            if (action === 'info') {
                const id = target.getAttribute('data-id');
                showPageInfo(id);
            } else if (action === 'copy') {
                const url = target.getAttribute('data-url');
                navigator.clipboard.writeText(url);
                alert('Store URL copied to clipboard!');
            }
        }

        function showPageInfo(adId) {
            const ad = currentAdsStore[adId];
            if (!ad) return;

            document.getElementById('mDp').src = ad.dp;
            document.getElementById('mTitle').innerHTML = `${ad.brandName} <span style="color:#0084ff;">☑️</span>`;
            document.getElementById('mCategory').innerText = ad.category;
            document.getElementById('mFollowers').innerText = ad.followers;
            document.getElementById('mActiveAds').innerText = ad.activeAds;
            document.getElementById('mPageAge').innerText = ad.pageAge;
            document.getElementById('mCreatedDate').innerText = ad.createdDate;
            document.getElementById('mInstaHandle').innerText = ad.instaHandle;
            document.getElementById('mPageId').innerText = ad.pageId;
            
            const storeLink = document.getElementById('mStoreLink');
            storeLink.href = ad.storeUrl;
            storeLink.innerText = ad.storeUrl.replace('https://', '');

            document.getElementById('mDirectStoreBtn').href = ad.storeUrl;
            document.getElementById('pageInfoModal').classList.add('active');
        }

        function closePageInfo() {
            document.getElementById('pageInfoModal').classList.remove('active');
        }

        feedContainer.addEventListener('scroll', handleFeedScroll);
        feedContainer.addEventListener('click', handleFeedClick);

        document.getElementById('searchBtn').addEventListener('click', () => renderFeed(false));
        document.querySelectorAll('header select, header input[type="date"]').forEach(elem => {
            elem.addEventListener('change', () => renderFeed(false));
        });

        document.getElementById('closeModalBtn').addEventListener('click', closePageInfo);
        document.getElementById('pageInfoModal').addEventListener('click', closePageInfo);

        renderFeed(false);
    </script>
</body>
                        </html>
